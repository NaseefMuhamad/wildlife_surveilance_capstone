<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reserve Watch · Live camera</title>
<style>
body{background:#0e1916;color:#e4eee8;font:16px system-ui;margin:0;padding:32px}main{max-width:1100px;margin:auto}a{color:#a6e6bc}h1{font-size:28px}form{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input{flex:1;min-width:220px}input,button{padding:12px;border-radius:8px;border:1px solid #37594b;background:#1b3027;color:inherit}button{cursor:pointer}.screen{aspect-ratio:16/9;background:#050a08;display:grid;place-items:center;border:1px solid #37594b;border-radius:12px;overflow:hidden}.screen img{width:100%;height:100%;object-fit:contain}.muted{color:#a8bdb1}#status{min-height:28px}strong{color:#b6f28e}
</style>
<main><a href="/dashboard">← Surveillance dashboard</a><h1>Reserve Watch / Live phone camera</h1>
<p class="muted">Connect your phone and PC to the same Wi-Fi. Start a camera-streaming app on your phone and paste its HTTP/MJPEG stream address below.</p>
<form id="connect"><input id="camera-name" aria-label="Camera name" placeholder="Camera name (e.g. Main gate)" required maxlength="60"><input id="camera-location" aria-label="Camera location" placeholder="Location (optional)" maxlength="60"><input id="source" type="url" required placeholder="http://192.168.1.50:8080/video" aria-label="Phone camera stream URL"><button>Connect camera</button></form>
<p id="status" role="status"></p></main>
<script>
const form = document.querySelector('#connect');
const statusEl = document.querySelector('#status');
const submit = form.querySelector('button');
form.onsubmit = async event => {
  event.preventDefault();
  submit.disabled = true;
  statusEl.textContent = 'Connecting to camera…';
  try {
    const response = await fetch('/api/live/connect', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name: document.querySelector('#camera-name').value,
        location: document.querySelector('#camera-location').value,
        source: document.querySelector('#source').value
      })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    while (true) {
      const statusResponse = await fetch('/api/live/status', {cache: 'no-store'});
      if (!statusResponse.ok) throw new Error('Camera status unavailable.');
      const camera = (await statusResponse.json()).find(item => item.id === result.id);
      if (!camera) throw new Error('Camera was removed.');
      if (camera.status === 'error') {
        await fetch('/api/live/disconnect', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({id: camera.id})
        });
        throw new Error(camera.error);
      }
      if (camera.status === 'live') {
        location.assign('/dashboard#camera-' + camera.id);
        return;
      }
      await new Promise(resolve => setTimeout(resolve, 500));
    }
  } catch (error) {
    statusEl.textContent = error.message;
    submit.disabled = false;
  }
};
</script></html>
